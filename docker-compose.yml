services:
  mysql:
    image: mysql:8.4
    container_name: loyalty-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loyalty_platform
      MYSQL_USER: loyalty
      MYSQL_PASSWORD: loyalty123

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped

volumes:
  mysql_data: